name: Build iOS IPA

on:
  workflow_dispatch: # Cho phép bấm chạy thủ công trên giao diện GitHub
  push:
    branches:
      - master
      - main

jobs:
  build:
    name: Build Unsigned IPA for Sideloadly
    runs-on: macos-14 # Chạy trên macOS mới nhất có sẵn Xcode

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App (No Codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Package App into IPA for Sideloadly
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -9 FrameCrop.ipa Payload
          echo "IPA size: $(ls -lh FrameCrop.ipa | awk '{print $5}')"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameCrop-iOS-IPA
          path: build/ios/ipa/FrameCrop.ipa
          retention-days: 14
